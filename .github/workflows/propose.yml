# The reusable workflow that opens, updates and closes the sync pull requests of an implementation
# repository. An implementation calls it on a schedule from a job that grants contents: write and
# pull-requests: write. spec propose writes the pull requests with the token of that job.
name: Propose

on:
  workflow_call:
    inputs:
      version:
        description: The release of spec that the workflow installs, such as v0.1.0.
        required: true
        type: string

permissions: {}

jobs:
  propose:
    name: Propose
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install spec
        env:
          VERSION: ${{ inputs.version }}
        run: go install "go.stealthscale.io/spec/cmd/spec@${VERSION}"
      - name: Propose
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: spec propose --repo "${REPO}"
