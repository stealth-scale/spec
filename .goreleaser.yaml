# Managed by ergon init. Add repository settings to .ergon/local/.goreleaser.yaml and run ergon init sync.
#
# The commands of the root module, which the key binaries of the section go of .ergon.yaml lists.
# ergon release pack builds, packs and signs them for each release of the module in the job pack of
# release.yml: it tags the commit with the tag of the module, and runs GoReleaser in snapshot mode
# with the version of the release in ERGON_VERSION. ergon release publish attaches the assets to the
# release of the tag before it publishes the release.

version: 2

project_name: spec

dist: dist/goreleaser/spec

snapshot:
  version_template: "{{ .Env.ERGON_VERSION }}"

# Each command with completions writes the scripts of bash, zsh and fish with its command
# completion, and its archives, packages and cask contain them.
before:
  hooks:
    - sh -c 'mkdir -p dist/completions/spec && for s in bash zsh fish; do go -C . run ./cmd/spec completion "$s" > "dist/completions/spec/spec.$s"; done'

# A static binary without the paths of the runner, the symbol table and DWARF data. Go writes the
# version of the module from its tag, and applies a default.pgo beside the main package. The build
# <name>-upx has the Linux targets of a command, and UPX packs each of its binaries with LZMA, whose
# packed binaries syft still reads. UPX refuses macOS binaries, and syft reads no packed Windows
# binary, so the build <name> of the other targets has no UPX.
builds:
  - id: spec
    dir: .
    main: ./cmd/spec
    binary: spec
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - windows_amd64_v1
      - windows_arm64_v8.0
  - id: spec-upx
    dir: .
    main: ./cmd/spec
    binary: spec
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
    hooks:
      post:
        - ergon tool run go.upx -- --best --lzma --quiet "{{ .Path }}"

# The files of each archive have a fixed owner and mode and the time of the commit, so the bytes of
# an archive do not depend on the runner.
archives:
  - id: spec
    ids: [spec, spec-upx]
    formats: [tar.gz]
    name_template: "spec_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}
    files:
      - src: LICENSE*
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: README.md
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: dist/completions/spec/*
        dst: completions
        strip_parent: true
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}

nfpms:
  - id: spec
    ids: [spec, spec-upx]
    package_name: spec
    file_name_template: '{{ replace .ConventionalFileName "~" "-" }}'
    vendor: "Stealth Scale B.V."
    maintainer: "Stealth Scale B.V. <security@stealthscale.io>"
    homepage: https://github.com/stealth-scale/spec
    description: "Vendors conformance definitions into implementations and keeps the copies in sync"
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    mtime: "{{ .CommitDate }}"
    contents:
      - src: dist/completions/spec/spec.bash
        dst: /usr/share/bash-completion/completions/spec
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: dist/completions/spec/spec.zsh
        dst: /usr/share/zsh/vendor-completions/_spec
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: dist/completions/spec/spec.fish
        dst: /usr/share/fish/vendor_completions.d/spec.fish
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: LICENSE
        dst: /usr/share/doc/spec/copyright
        file_info: {mode: 0644, mtime: "{{ .CommitDate }}"}
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

source:
  enabled: true
  name_template: "spec_{{ .Version }}_source"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# cosign signs checksums.txt with the OIDC identity of the workflow, without a key.
signs:
  - cmd: ergon
    signature: "${artifact}.sigstore.json"
    args: [tool, run, go.cosign, --, sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    artifacts: checksum

# syft writes an SPDX SBOM of each archive and each package, which checksums.txt lists.
# It reads the license of each Go module of a binary from the module proxy. GOPRIVATE names the
# modules of the release, which ergon release pack passes in ERGON_MODULES, so syft does not ask
# the proxy for a version before the publish creates its tag.
sboms:
  - id: archives
    cmd: ergon
    args: [tool, run, go.syft, --, "$artifact", --output, "spdx-json=$document", --enrich, all]
    env: ["GOPRIVATE={{ .Env.ERGON_MODULES }}"]
    artifacts: archive
  - id: packages
    cmd: ergon
    args: [tool, run, go.syft, --, "$artifact", --output, "spdx-json=$document", --enrich, all]
    env: ["GOPRIVATE={{ .Env.ERGON_MODULES }}"]
    artifacts: package

# ergon creates the release of the tag, and changesets writes its notes.
changelog:
  disable: true

release:
  disable: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
